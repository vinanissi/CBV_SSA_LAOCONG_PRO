<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><?= (MODEL && MODEL.title) ? MODEL.title : "WebApp Workspace" ?></title>
    <style>
      :root { --bg:#0b1220; --card:#111a2e; --text:#e7eefc; --muted:#a7b4d6; --line:#233256; --warn:#f5a524; --ok:#2dd4bf; }
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
      .wrap { max-width: 980px; margin: 0 auto; padding: 16px; padding-bottom: 96px; }
      .top { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
      .title { font-size: 18px; font-weight: 700; }
      .badge { font-size: 12px; padding: 4px 8px; border-radius: 999px; border:1px solid var(--line); background:#0f1930; color: var(--muted); }
      .badge.ok { color: var(--ok); border-color: rgba(45,212,191,.35); }
      .badge.warn { color: var(--warn); border-color: rgba(245,165,36,.35); }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
      .muted { color: var(--muted); }
      a { color: #9dd5ff; }
      code { background: rgba(255,255,255,.06); padding: 2px 6px; border-radius: 8px; }
      .footer { margin-top: 12px; font-size: 12px; color: var(--muted); }
      /* cbv-global-action-bar */
      #cbv-global-action-bar.cbv-global-action-bar {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch;
      }
      .cbv-btn-operational {
        display: inline-block; min-height: 48px; min-width: 48px; line-height: 1.2; padding: 12px 16px;
        font-size: 15px; font-weight: 600; border-radius: 14px; border: 1px solid #2b3f73;
        background: #152042; color: #dbeafe; text-decoration: none; text-align: center;
      }
      .cbv-btn-operational:hover { filter: brightness(1.08); }
      .cbv-action-active { outline: 2px solid #2dd4bf; outline-offset: 2px; }
      @media (max-width: 720px) {
        .cbv-mobile-stack { flex-direction: column !important; }
        .cbv-mobile-stack .cbv-btn-operational { width: 100%; box-sizing: border-box; }
      }
      /* cbv-toast-host */
      #cbv-toast-host.cbv-toast-host {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        z-index: 9999; max-width: min(560px, 92vw); padding: 10px 14px; border-radius: 12px;
        background: #152042; border: 1px solid #2b3f73; color: #dbeafe; font-size: 14px;
        box-shadow: 0 8px 30px rgba(0,0,0,.35); display: none;
      }
      #cbv-toast-host.cbv-toast-host.cbv-toast-visible { display: block; }
      /* cbv-loading-overlay */
      #cbv-loading-overlay.cbv-loading-overlay {
        position: fixed; inset: 0; background: rgba(5,8,14,.55); display: flex; align-items: center; justify-content: center;
        z-index: 9998; transition: opacity .2s;
      }
      .cbv-loading-dots { font-weight: 700; letter-spacing: .05em; color: #e7eefc; }
      .cbv-hidden { opacity: 0; pointer-events: none; visibility: hidden; }
    </style>
  </head>
  <body>
    <? var L = (MODEL && MODEL.i18n) ? MODEL.i18n : {}; ?>
    <div class="wrap cbv-staff-mobile-stack">
      <div class="top">
        <div>
          <div class="title"><?= MODEL.title ?></div>
          <div class="muted"><?= L.routeChip || "route" ?>: <code><?= MODEL.route ?></code></div>
        </div>
        <div class="badge ok" title="<?= L.readFirstTitle || "READ_FIRST" ?>"><?= L.readFirstBadge || "READ_FIRST" ?></div>
      </div>

      <!-- Shell markers: cbv-primary-nav cbv-secondary-quick-links cbv-nav-no-duplicate cbv-staff-default-daily (primary injected via MODEL.actionBarHtml; secondary in MODEL.navHtml) -->
      <? if (MODEL.actionBarHtml) { ?>
        <div class="card" style="margin-top:12px">
          <?!= MODEL.actionBarHtml ?>
        </div>
      <? } ?>

      <div class="card">
        <?!= MODEL.navHtml ?>
      </div>

      <? if (MODEL.warnings && MODEL.warnings.length) { ?>
        <div class="card">
          <div class="badge warn"><?= L.warningsBadge || "WARNING" ?></div>
          <div style="margin-top:8px">
            <ul>
              <? for (var i=0; i<MODEL.warnings.length; i++) { ?>
                <li class="muted"><?= MODEL.warnings[i] ?></li>
              <? } ?>
            </ul>
          </div>
        </div>
      <? } ?>

      <div class="card">
        <?!= MODEL.bodyHtml ?>
      </div>

      <div class="footer">
        <?= L.checkedAt || "checkedAt" ?>: <?= MODEL.checkedAt ?>
        <div><?= MODEL.footerSafetyVi || (L.rulesLine || "Rules: No auto assign · No auto resolve · No auto escalate · No production claim") ?></div>
      </div>
    </div>

    <div id="cbv-toast-host" class="cbv-toast-host" aria-live="polite"></div>
    <div id="cbv-loading-overlay" class="cbv-loading-overlay cbv-hidden" data-cbv-loading>
      <div class="cbv-loading-dots">Đang tải…</div>
    </div>
    <script>
      (function () {
        var toastEl = document.getElementById('cbv-toast-host');
        var loadEl = document.getElementById('cbv-loading-overlay');
        function showToast(msg) {
          if (!toastEl) return;
          toastEl.textContent = msg || '';
          toastEl.classList.add('cbv-toast-visible');
          setTimeout(function () { toastEl.classList.remove('cbv-toast-visible'); }, 2200);
        }
        window.cbvToast = showToast;
        document.addEventListener('click', function (ev) {
          var a = ev.target.closest && ev.target.closest('a.cbv-busy-link');
          if (!a || !loadEl) return;
          loadEl.classList.remove('cbv-hidden');
          showToast('Đang mở trang…');
        });
        window.addEventListener('pageshow', function () {
          if (loadEl) loadEl.classList.add('cbv-hidden');
        });
      })();
    </script>
  </body>
</html>
