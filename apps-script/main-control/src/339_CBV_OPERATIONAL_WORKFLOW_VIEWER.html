<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body { font-family: Segoe UI, Arial, sans-serif; margin: 12px; font-size: 13px; }
      h1 { font-size: 16px; margin: 0 0 8px 0; }
      h2 { font-size: 14px; margin: 14px 0 6px 0; border-bottom: 1px solid #ccc; }
      table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 12px; }
      th, td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; vertical-align: top; }
      th { background: #f5f5f5; }
      pre { white-space: pre-wrap; word-break: break-word; background: #f8f9fa; padding: 8px; border-radius: 4px; max-height: 200px; overflow: auto; font-size: 11px; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #e8f0fe; color: #174ea6; font-weight: 600; }
      .muted { color: #555; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>CBV Operational Workflow Viewer</h1>
    <div class="muted">Phase E — timeline replay + linked verification bundle (read-only)</div>
    <div id="app"></div>
    <textarea id="raw" style="display: none"><?!= modelJson ?></textarea>
    <script>
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
      function tableFromMatrix(rows, maxCols) {
        if (!rows || !rows.length) return '<p class="muted">(no timeline rows)</p>';
        var mc = maxCols || rows[0].length;
        var h = '<table><thead><tr>';
        var c;
        for (c = 0; c < mc; c++) {
          h += '<th>col_' + c + '</th>';
        }
        h += '</tr></thead><tbody>';
        var r;
        for (r = 0; r < rows.length; r++) {
          h += '<tr>';
          var row = rows[r] || [];
          for (c = 0; c < mc; c++) {
            h += '<td>' + esc(row[c]) + '</td>';
          }
          h += '</tr>';
        }
        h += '</tbody></table>';
        return h;
      }
      try {
        var txt = document.getElementById('raw').value;
        var M = JSON.parse(txt);
        var vb = M.verificationBundle || {};
        var dg = vb.decisionGate || {};
        var risk = vb.risk || {};
        var gov = vb.governance || {};
        var html = '';
        html += '<div><span class="pill">runtime ' + esc(M.version) + '</span></div>';
        html += '<h2>Linked verification (cache)</h2>';
        html += '<p><strong>Suite:</strong> ' + esc(vb.testSuite) + ' &nbsp; <strong>Trace:</strong> ' + esc(vb.traceId) + '</p>';
        html += '<p><strong>Status / Severity:</strong> ' + esc(vb.status) + ' / ' + esc(vb.severity) + '</p>';
        html += '<h3>Decision gate</h3><pre>' + esc(JSON.stringify(dg, null, 2)) + '</pre>';
        html += '<h3>Risk</h3><pre>' + esc(JSON.stringify(risk, null, 2)) + '</pre>';
        html += '<h3>Governance summary</h3><pre>' + esc(JSON.stringify({ ok: gov.ok, violations: gov.violations }, null, 2)) + '</pre>';
        html += '<h2>Timeline (last rows)</h2>';
        html += tableFromMatrix(M.timelineRows || [], 6);
        html += '<h2>State vocabulary</h2><pre>' + esc(JSON.stringify(M.states, null, 2)) + '</pre>';
        document.getElementById('app').innerHTML = html;
      } catch (e) {
        document.getElementById('app').innerHTML = '<p style="color:#b00020">Parse/render error: ' + esc(e && e.message ? e.message : e) + '</p>';
      }
    </script>
  </body>
</html>
