<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 10px;
      }
      textarea {
        width: 100%;
        height: 520px;
        font-family: Consolas, monospace;
        font-size: 11px;
      }
      .row {
        margin-top: 8px;
      }
      button {
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <button type="button" onclick="copyText()">Copy handoff</button>
    </div>
    <div class="row">
      <textarea id="hand"><?= promptText ?></textarea>
    </div>
    <script>
      function copyText() {
        var t = document.getElementById('hand');
        t.focus();
        t.select();
        try {
          document.execCommand('copy');
        } catch (e) {}
      }
    </script>
  </body>
</html>
